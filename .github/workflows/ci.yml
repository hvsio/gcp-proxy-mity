name: Clean Up GCP Resources

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.REGION || 'europe-west4' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'homey-bw58-terraform-state' }}
  TF_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX || 'gcp-proxy-mity' }}

jobs:
  cleanup:
    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5

      - name: Create terraform.tfvars
        run: |
          cd terraform
          python3 - <<'PY' > terraform.tfvars
          import json
          import os

          values = {
              "project_id": os.environ["PROJECT_ID"],
              "region": os.environ["GCP_REGION"],
          }

          for key, value in values.items():
              print(f"{key} = {json.dumps(value)}")
          PY
          cat terraform.tfvars

      - name: Terraform Init
        run: |
          cd terraform
          terraform init -input=false \
            -backend-config=bucket="$TF_STATE_BUCKET" \
            -backend-config=prefix="$TF_STATE_PREFIX"

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -input=false -auto-approve tfplan

      - name: Summarize Cleanup
        run: |
          cd terraform
          echo "## GCP cleanup complete" >> $GITHUB_STEP_SUMMARY
          echo "- Terraform removed all managed resources declared in state." >> $GITHUB_STEP_SUMMARY
